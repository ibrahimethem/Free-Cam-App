name: FreeCam
options:
  bundleIdPrefix: com.ethem.nosubcam
  deploymentTarget:
    iOS: '26.0'
targets:
  FreeCam:
    type: application
    platform: iOS
    sources: [FreeCam]
    settings:
      base:
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.ethem.nosubcam
        DEVELOPMENT_TEAM: G478PYWXZ4
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NoSub Cam
        UILaunchScreen: {}
        NSCameraUsageDescription: NoSub Cam uses the camera you select to stream live video directly to your computer.
        NSLocalNetworkUsageDescription: NoSub Cam connects directly to NoSub Studio on your local network to send camera video and settings.
        NSBonjourServices: [_nosubcam._tcp]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FreeCamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FreeCamTests]
    dependencies:
      - target: FreeCam
    settings:
      base:
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
  FreeCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FreeCamUITests]
    dependencies:
      - target: FreeCam
    settings:
      base:
        SWIFT_VERSION: '5.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.ethem.nosubcam.uitests
        DEVELOPMENT_TEAM: G478PYWXZ4
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreeCam:
    build:
      targets:
        FreeCam: all
    test:
      targets: [FreeCamTests]
  FreeCam Screenshots:
    build:
      targets:
        FreeCam: all
        FreeCamUITests: [test]
    test:
      targets: [FreeCamUITests]
