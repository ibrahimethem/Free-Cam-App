name: Build Windows camera test package
on:
  workflow_dispatch:
    inputs:
      request_signing:
        description: Request SignPath signing of project binaries (requires Foundation acceptance and manual approval; not an installer release)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'desktop/**'
      - 'receiver/**'
      - '.github/workflows/windows-camera.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Read product version
        id: product
        shell: pwsh
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Hardware-free regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: desktop
        run: python -m unittest desktop.test_signing_config desktop.test_packaging desktop.test_pairing desktop.test_background desktop.test_camera_setup desktop.test_virtual_camera desktop.test_windows_camera desktop.test_single_instance desktop.test_desktop.DesktopTests.test_virtual_camera_toggles_do_not_restart_or_block_wifi_receiver
      - name: Build native camera and desktop package (no installation)
        run: python desktop/build.py --native-camera
      - name: Verify project binary metadata and license inclusion
        shell: pwsh
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $names = @('FreeCam.exe', '_internal/native-camera/NoSubCamera.dll', '_internal/native-camera/NoSubCameraSetup.exe')
          foreach ($name in $names) {
            $info = (Get-Item (Join-Path dist/FreeCam $name)).VersionInfo
            if ($info.ProductName -ne 'NoSub Studio' -or $info.ProductVersion -ne $version) { throw "Product metadata missing: $name" }
          }
          if (-not (Test-Path dist/FreeCam/_internal/licenses/LICENSE)) { throw 'MIT license missing from bundle' }
      - name: Portable native pixel checks
        shell: pwsh
        run: |
          & build/native-camera-windows/Release/NoSubPixelTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/native-camera-windows/Release/NoSubSourceTests.exe (Resolve-Path build/native-camera-windows/Release/NoSubCamera.dll).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/native-camera-windows/Release/NoSubRestartTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/native/windows/TESTING.md dist/FreeCam/WINDOWS-TESTING.md
      - name: Verify bundled bridge (no device registration)
        env:
          PYTHONPATH: desktop
        run: >-
          python -c "import sys; from pathlib import Path; sys.frozen = True;
          sys._MEIPASS = str(Path('dist/FreeCam/_internal').resolve());
          from virtual_camera import CameraController, controller_path;
          assert controller_path() is not None;
          controller = CameraController(); controller.load();
          print('Packaged native bridge and C ABI loaded; no camera installed')"
      - name: Build unsigned installer (no installation)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            throw 'Inno Setup 6 must be available on this build runner'
          }
          python desktop/packaging/package_windows.py --allow-unsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned installer (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: NoSub-Studio-Windows-x64-installer-test
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned test package (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: NoSub-Studio-Windows-x64-test
          path: dist/FreeCam/
          if-no-files-found: error
          retention-days: 14

  # First signing phase only. Separate protected job: PR/test builds cannot
  # access the environment token. Installer/uninstaller signing remains pending.
  sign_project_binaries:
    if: github.event_name == 'workflow_dispatch' && inputs.request_signing && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read product version
        id: product
        shell: pwsh
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Retrieve this workflow's tested portable package
        uses: actions/download-artifact@v4
        with:
          name: NoSub-Studio-Windows-x64-test
          path: dist/FreeCam
      - name: Check signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          BUILD_REF: ${{ github.ref }}
        run: |
          if ($env:BUILD_REF -ne 'refs/heads/main') { throw 'Production signing is restricted to main' }
          if (-not $env:SIGNPATH_API_TOKEN -or -not $env:SIGNPATH_ORGANIZATION_ID) { throw 'SignPath acceptance/account setup is still required' }
          if ($env:SIGNPATH_CERTIFICATE_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Pin the approved signer certificate before signing' }
      - name: Upload project signing input
        id: signing_input
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NoSub-Studio-project-signing-input
          path: |
            dist/FreeCam/FreeCam.exe
            dist/FreeCam/_internal/native-camera/NoSubCamera.dll
            dist/FreeCam/_internal/native-camera/NoSubCameraSetup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Request manually approved SignPath signing
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing && github.ref == 'refs/heads/main'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nosub-studio
          signing-policy-slug: release-signing
          artifact-configuration-slug: nosub-studio-binaries-v1
          github-artifact-id: ${{ steps.signing_input.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.product.outputs.version }}"
          wait-for-completion: true
          output-artifact-directory: build/signpath-returned
      - name: Verify approved signed binaries
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          $names = @('FreeCam.exe', '_internal/native-camera/NoSubCamera.dll', '_internal/native-camera/NoSubCameraSetup.exe')
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          foreach ($name in $names) {
            $file = Join-Path build/signpath-returned $name
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER -or -not $signature.TimeStamperCertificate) {
              throw 'Signed output is untrusted, untimestamped, or from an unexpected publisher'
            }
            $info = (Get-Item -LiteralPath $file).VersionInfo
            if ($info.ProductName -ne 'NoSub Studio' -or $info.ProductVersion -ne $version) { throw 'Unexpected product/version in signed artifact' }
          }
      - name: Upload verified signed project binaries (not a finished installer)
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NoSub-Studio-signed-project-binaries
          path: build/signpath-returned/
          if-no-files-found: error
          retention-days: 14
